<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo en Antofagasta | Portal Oficial de Empleos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --bg-page: #F8FAFC;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding: 24px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--primary);
    }

    .badge-city {
      background-color: #EFF6FF;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .instagram-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F1F5F9;
      color: #334155;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .instagram-btn:hover {
      background: #E2E8F0;
      color: #0F172A;
    }

    .search-filter-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: #F8FAFC;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      white-space: nowrap;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn.active, .pill-btn:hover {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .status-bar {
      max-width: 1040px;
      margin: 16px auto 8px auto;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .grid-ofertas {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 12px;
    }

    @media (min-width: 768px) {
      .grid-ofertas {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    .card-cargo {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .card-empresa {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-postular {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background-color: var(--primary);
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: background-color 0.2s ease;
      text-transform: uppercase;
    }

    .btn-postular:hover {
      background-color: var(--primary-dark);
    }

    .state-container {
      text-align: center;
      padding: 60px 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="top-bar">
        <div class="brand-title">
          Trabajo en <span>Antofagasta</span>
          <span class="badge-city">Chile</span>
        </div>
        <a href="https://instagram.com/trabajo_en_antofagasta" target="_blank" rel="noopener noreferrer" class="instagram-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
          </svg>
          @trabajo_en_antofagasta
        </a>
      </div>

      <div class="search-filter-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="busquedaInput" class="search-input" placeholder="Buscar por cargo, empresa o palabra clave...">
        </div>

        <div class="category-pills" id="pillsContainer">
          <button class="pill-btn active" data-cat="TODAS">Todas</button>
          <button class="pill-btn" data-cat="Gastronomía">Gastronomía</button>
          <button class="pill-btn" data-cat="Comercial">Comercial</button>
          <button class="pill-btn" data-cat="Administrativo">Administrativo</button>
          <button class="pill-btn" data-cat="TECNICO / MANTENCION">Técnico / Mantención</button>
          <button class="pill-btn" data-cat="Logistica">Logística</button>
          <button class="pill-btn" data-cat="Salud">Salud</button>
          <button class="pill-btn" data-cat="Educación">Educación</button>
          <button class="pill-btn" data-cat="Construcción">Construcción</button>
          <button class="pill-btn" data-cat="Otros">Otros</button>
        </div>
      </div>
    </div>
  </header>

  <div class="status-bar">
    <span id="contadorTexto">Cargando vacantes...</span>
    <span id="fuenteTexto">Sincronizado vía GitHub Actions</span>
  </div>

  <main class="container">
    <div id="loader" class="state-container">
      <div class="spinner"></div>
      <p>Cargando ofertas vigentes...</p>
    </div>

    <div id="sinResultados" class="state-container" style="display: none;">
      <p>No se encontraron vacantes con el criterio de búsqueda seleccionado.</p>
    </div>

    <div class="grid-ofertas" id="contenedorOfertas"></div>
  </main>

  <script>
    const CIUDAD_NOMBRE = "Antofagasta";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9XJF0y5jmYYSOBBqpNIWWrceyPMg4nHcZbhRKSHlJrcky4qo3bMG5CG78Duh4Cksg6Q/exec";
    const CACHE_KEY = "ofertas_antofagasta_v1";
    const INSTAGRAM_USER = "@trabajo_en_antofagasta";

    const CAT_COLORS = {
      "Gastronomía": { bg: "#795447", text: "#FFFFFF" },
      "Comercial": { bg: "#FF8900", text: "#FFFFFF" },
      "Administrativo": { bg: "#5A7EFF", text: "#FFFFFF" },
      "TECNICO / MANTENCION": { bg: "#00BCD3", text: "#000000" },
      "Logistica": { bg: "#FFDD20", text: "#000000" },
      "Otros": { bg: "#B6B6B6", text: "#FFFFFF" },
      "Salud": { bg: "#2DAE61", text: "#FFFFFF" },
      "Educación": { bg: "#E81D62", text: "#FFFFFF" },
      "Construcción": { bg: "#FF0000", text: "#FFFFFF" }
    };

    let todasLasOfertas = [];
    let categoriaActiva = "TODAS";
    let textoBusqueda = "";

    async function cargarOfertas() {
      const loader = document.getElementById("loader");
      
      const localData = localStorage.getItem(CACHE_KEY);
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          if (Array.isArray(parsed) && parsed.length > 0) {
            todasLasOfertas = parsed;
            renderizar();
            loader.style.display = "none";
          }
        } catch (e) {
          console.warn("Caché local no procesable:", e);
        }
      }

      try {
        const respuesta = await fetch("ofertas.json", { cache: "no-cache" });
        if (respuesta.ok) {
          const datos = await respuesta.json();
          if (Array.isArray(datos) && datos.length > 0) {
            todasLasOfertas = datos;
            localStorage.setItem(CACHE_KEY, JSON.stringify(datos));
            renderizar();
            loader.style.display = "none";
            return;
          }
        }
        throw new Error("ofertas.json vacío o inaccesible");
      } catch (errPrimario) {
        console.warn("Fallo lectura de ofertas.json local, recurriendo a WebApp Apps Script:", errPrimario);
        try {
          const resFallback = await fetch(APPS_SCRIPT_URL);
          if (resFallback.ok) {
            const datosFallback = await resFallback.json();
            if (Array.isArray(datosFallback)) {
              todasLasOfertas = datosFallback;
              localStorage.setItem(CACHE_KEY, JSON.stringify(datosFallback));
              renderizar();
            }
          }
        } catch (errFallback) {
          console.error("Error al sincronizar datos:", errFallback);
        } finally {
          loader.style.display = "none";
        }
      }
    }

    function normalizarTexto(txt) {
      return (txt || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function filtrarOfertas() {
      const query = normalizarTexto(textoBusqueda);
      const catFiltro = normalizarTexto(categoriaActiva);

      return todasLasOfertas.filter(item => {
        const cargoNorm = normalizarTexto(item.cargo);
        const empresaNorm = normalizarTexto(item.empresa);
        const catNorm = normalizarTexto(item.cat);

        const coincideTexto = !query || cargoNorm.includes(query) || empresaNorm.includes(query) || catNorm.includes(query);
        const coincideCategoria = (categoriaActiva === "TODAS") || (catNorm === catFiltro);

        return coincideTexto && coincideCategoria;
      });
    }

    function renderizar() {
      const listaFiltrada = filtrarOfertas();
      const contenedor = document.getElementById("contenedorOfertas");
      const sinResultados = document.getElementById("sinResultados");
      const contadorTexto = document.getElementById("contadorTexto");

      contadorTexto.innerText = `${listaFiltrada.length} vacante${listaFiltrada.length === 1 ? "" : "s"} disponible${listaFiltrada.length === 1 ? "" : "s"}`;

      if (listaFiltrada.length === 0) {
        contenedor.innerHTML = "";
        sinResultados.style.display = "block";
        return;
      }

      sinResultados.style.display = "none";

      contenedor.innerHTML = listaFiltrada.map(oferta => {
        const categoria = oferta.cat || "Otros";
        const estiloColor = CAT_COLORS[categoria] || { bg: "#B6B6B6", text: "#FFFFFF" };
        const urlDestino = oferta.url && oferta.url.startsWith("http") ? oferta.url : "#";

        return `
          <article class="card">
            <div>
              <div class="card-top">
                <span class="card-badge" style="background-color: ${estiloColor.bg}; color: ${estiloColor.text};">
                  ${categoria}
                </span>
                <span class="card-date">${oferta.fecha || ""}</span>
              </div>
              <h2 class="card-cargo">${oferta.cargo || "Oferta de empleo"}</h2>
              <p class="card-empresa">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                  <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                  <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                  <path d="M10 6h4"></path>
                  <path d="M10 10h4"></path>
                  <path d="M10 14h4"></path>
                  <path d="M10 18h4"></path>
                </svg>
                ${oferta.empresa || "Empresa confidencial"}
              </p>
            </div>
            <a href="${urlDestino}" target="_blank" rel="noopener noreferrer" class="btn-postular">
              Postular Ahora
            </a>
          </article>
        `;
      }).join("");
    }

    document.getElementById("busquedaInput").addEventListener("input", (e) => {
      textoBusqueda = e.target.value;
      renderizar();
    });

    document.getElementById("pillsContainer").addEventListener("click", (e) => {
      const boton = e.target.closest(".pill-btn");
      if (!boton) return;

      document.querySelectorAll(".pill-btn").forEach(btn => btn.classList.remove("active"));
      boton.classList.add("active");

      categoriaActiva = boton.getAttribute("data-cat");
      renderizar();
    });

    window.addEventListener("DOMContentLoaded", cargarOfertas);
  </script>
</body>
</html>
